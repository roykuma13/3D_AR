<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GLB AR Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; }

  /* 回転コントロールUI */
  #controls {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.9);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .btn:active { background: rgba(200, 200, 200, 0.95); }

  /* 中央の自動回転トグルボタンは少し大きく */
  #btn-auto {
    width: 64px;
    height: 64px;
    font-size: 26px;
    background: rgba(255,255,255,0.95);
  }
  #btn-auto.active {
    background: rgba(50, 200, 150, 0.92);
  }

  /* マーカー未検出時のガイド */
  #guide {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 500;
    color: white;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    transition: opacity 0.4s;
  }
  #guide.hidden { opacity: 0; }

  a-scene { position: fixed !important; inset: 0; }
</style>
</head>
<body>

<!-- ガイドテキスト -->
<div id="guide">Hiroマーカーをかざしてください</div>

<!-- 回転操作ボタン -->
<div id="controls">
  <button class="btn" id="btn-left"  title="左回転">↺</button>
  <button class="btn" id="btn-down"  title="下向き">↓</button>
  <button class="btn" id="btn-auto"  title="自動回転">▶</button>
  <button class="btn" id="btn-up"    title="上向き">↑</button>
  <button class="btn" id="btn-right" title="右回転">↻</button>
</div>

<!-- AR シーン -->
<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-assets>
    <!-- GLBファイル：index.htmlと同じフォルダに model.glb を置く -->
    <a-asset-item id="glb-model" src="./model.glb"></a-asset-item>
  </a-assets>

  <a-marker preset="hiro" id="marker">
    <a-entity
      id="model-entity"
      gltf-model="#glb-model"
      position="0 0.5 0"
      rotation="0 0 0"
      scale="1 1 1">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const marker      = document.getElementById('marker');
  const guide       = document.getElementById('guide');
  const modelEntity = document.getElementById('model-entity');
  const btnAuto     = document.getElementById('btn-auto');

  // 現在の回転値
  let rotX = 0, rotY = 0;
  const STEP = 30; // ボタン1回あたりの回転角度（度）

  // 自動回転
  let autoRotate = false;
  let autoId = null;

  function applyRotation() {
    modelEntity.setAttribute('rotation', `${rotX} ${rotY} 0`);
  }

  // 左右回転（Y軸）
  document.getElementById('btn-left').addEventListener('click', () => {
    rotY -= STEP; applyRotation();
  });
  document.getElementById('btn-right').addEventListener('click', () => {
    rotY += STEP; applyRotation();
  });

  // 上下傾き（X軸）
  document.getElementById('btn-up').addEventListener('click', () => {
    rotX -= STEP; applyRotation();
  });
  document.getElementById('btn-down').addEventListener('click', () => {
    rotX += STEP; applyRotation();
  });

  // 自動回転トグル
  btnAuto.addEventListener('click', () => {
    autoRotate = !autoRotate;
    btnAuto.textContent = autoRotate ? '⏸' : '▶';
    btnAuto.classList.toggle('active', autoRotate);

    if (autoRotate) {
      autoId = setInterval(() => {
        rotY += 1;
        applyRotation();
      }, 16); // 約60fps
    } else {
      clearInterval(autoId);
    }
  });

  // マーカー検出・消失
  marker.addEventListener('markerFound', () => {
    guide.classList.add('hidden');
  });
  marker.addEventListener('markerLost', () => {
    guide.classList.remove('hidden');
  });
</script>
</body>
</html>
