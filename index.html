<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GLB AR Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; }

  /* 回転コントロールUI */
  #controls {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.9);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .btn:active { background: rgba(200, 200, 200, 0.95); }

  /* 中央の自動回転トグルボタンは少し大きく */
  #btn-auto {
    width: 64px;
    height: 64px;
    font-size: 26px;
    background: rgba(255,255,255,0.95);
  }
  #btn-auto.active {
    background: rgba(50, 200, 150, 0.92);
  }

  /* マーカー未検出時のガイド */
  #guide {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 500;
    color: white;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    transition: opacity 0.4s;
  }
  #guide.hidden { opacity: 0; }

  a-scene { position: fixed !important; inset: 0; }
</style>
</head>
<body>

<!-- ガイドテキスト -->
<div id="guide">Hiroマーカーをかざしてください</div>

<!-- 操作ヒント（マーカー検出後に表示） -->
<div id="hint" style="
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 0.5s;
  background: rgba(0,0,0,0.5); color: #fff; font-size: 11px;
  padding: 6px 14px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.05em;
">スワイプ：回転　｜　ピンチ：拡大縮小</div>

<!-- 回転操作ボタン -->
<div id="controls">
  <button class="btn" id="btn-left"  title="左回転">↺</button>
  <button class="btn" id="btn-down"  title="下向き">↓</button>
  <button class="btn" id="btn-auto"  title="自動回転">▶</button>
  <button class="btn" id="btn-up"    title="上向き">↑</button>
  <button class="btn" id="btn-right" title="右回転">↻</button>
</div>

<!-- AR シーン -->
<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-assets>
    <!-- GLBファイル：index.htmlと同じフォルダに model.glb を置く -->
    <a-asset-item id="glb-model" src="./model.glb"></a-asset-item>
  </a-assets>

  <a-marker preset="hiro" id="marker">
    <a-entity
      id="model-entity"
      gltf-model="#glb-model"
      position="0 0.5 0"
      rotation="0 0 0"
      scale="0.5 0.5 0.5">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const marker      = document.getElementById('marker');
  const guide       = document.getElementById('guide');
  const modelEntity = document.getElementById('model-entity');
  const btnAuto     = document.getElementById('btn-auto');

  // 現在の回転値
  let rotX = 0, rotY = 0;
  const STEP = 30; // ボタン1回あたりの回転角度（度）

  // 自動回転
  let autoRotate = false;
  let autoId = null;

  function applyRotation() {
    modelEntity.setAttribute('rotation', `${rotX} ${rotY} 0`);
  }

  // 左右回転（Y軸）
  document.getElementById('btn-left').addEventListener('click', () => {
    rotY -= STEP; applyRotation();
  });
  document.getElementById('btn-right').addEventListener('click', () => {
    rotY += STEP; applyRotation();
  });

  // 上下傾き（X軸）
  document.getElementById('btn-up').addEventListener('click', () => {
    rotX -= STEP; applyRotation();
  });
  document.getElementById('btn-down').addEventListener('click', () => {
    rotX += STEP; applyRotation();
  });

  // 自動回転トグル
  btnAuto.addEventListener('click', () => {
    autoRotate = !autoRotate;
    btnAuto.textContent = autoRotate ? '⏸' : '▶';
    btnAuto.classList.toggle('active', autoRotate);

    if (autoRotate) {
      autoId = setInterval(() => {
        rotY += 1;
        applyRotation();
      }, 16); // 約60fps
    } else {
      clearInterval(autoId);
    }
  });

  // マーカー検出・消失
  const hint = document.getElementById('hint');
  let hintTimer = null;

  marker.addEventListener('markerFound', () => {
    guide.classList.add('hidden');
    // ヒントを3秒表示して自動的に消す
    hint.style.opacity = '1';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 3000);
  });
  marker.addEventListener('markerLost', () => {
    guide.classList.remove('hidden');
    hint.style.opacity = '0';
  });

  // =====================
  // スワイプ回転（1本指）
  // =====================
  let touchStartX = 0, touchStartY = 0;
  let rotXAtTouch = 0, rotYAtTouch = 0;
  const SWIPE_SENSITIVITY = 0.4; // 感度（大きいほど速く回る）

  document.addEventListener('touchstart', (e) => {
    // ボタン上のタッチは除外
    if (e.target.closest('#controls')) return;
    if (e.touches.length === 1) {
      touchStartX   = e.touches[0].clientX;
      touchStartY   = e.touches[0].clientY;
      rotXAtTouch   = rotX;
      rotYAtTouch   = rotY;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (e.target.closest('#controls')) return;
    if (e.touches.length === 1) {
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      rotY = rotYAtTouch + dx * SWIPE_SENSITIVITY;
      rotX = rotXAtTouch + dy * SWIPE_SENSITIVITY;
      applyRotation();
    }
  }, { passive: true });

  // =====================
  // ピンチズーム（2本指）
  // =====================
  let scaleVal = 1;
  let pinchStartDist = 0;
  let scaleAtPinch   = 1;
  const SCALE_MIN = 0.2;
  const SCALE_MAX = 5.0;

  function getPinchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = getPinchDist(e.touches);
      scaleAtPinch   = scaleVal;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const dist  = getPinchDist(e.touches);
      const ratio = dist / pinchStartDist;
      scaleVal    = Math.min(SCALE_MAX, Math.max(SCALE_MIN, scaleAtPinch * ratio));
      modelEntity.setAttribute('scale', `${scaleVal} ${scaleVal} ${scaleVal}`);
    }
  }, { passive: true });
</script>
</body>
</html>
